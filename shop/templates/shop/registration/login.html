{% extends 'shop/base.html' %}
{% block title %}Авторизация — VoltMarket{% endblock %}
{% block content %}
<section class="auth-card">
    <p class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</p>
    <h1>Авторизация</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn" type="submit">Войти</button>
    </form>
    <p class="auth-note">Нет аккаунта? <a href="{% url 'shop:register' %}">Зарегистрироваться</a></p>
</section>
{% endblock %}
