{% extends 'shop/base.html' %}{% block content %}<a class="back" href="{% url 'shop:customer_list' %}">← К покупателям</a><div class="detail"><h1>{{ customer.full_name }}</h1><p><strong>Телефон:</strong> {{ customer.phone }}</p><p><strong>E-mail:</strong> {{ customer.email }}</p><p><strong>Адрес:</strong> {{ customer.address }}</p><p><strong>Заказов:</strong> {{ customer.orders.count }}</p>{% if user.is_staff %}<div class="actions"><a class="btn" href="{% url 'shop:customer_edit' customer.pk %}">Изменить</a><a class="btn danger" href="{% url 'shop:customer_delete' customer.pk %}">Удалить</a></div>{% endif %}</div>{% endblock %}
