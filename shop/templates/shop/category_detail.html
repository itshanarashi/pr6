{% extends 'shop/base.html' %}{% block content %}<a class="back" href="{% url 'shop:category_list' %}">← К списку категорий</a><div class="detail"><h1>{{ category.name }}</h1><p>{{ category.description|default:'Описание не указано.' }}</p><p><strong>Количество товаров:</strong> {{ category.products.count }}</p>{% if user.is_staff %}<div class="actions"><a class="btn" href="{% url 'shop:category_edit' category.pk %}">Изменить</a><a class="btn danger" href="{% url 'shop:category_delete' category.pk %}">Удалить</a></div>{% endif %}</div>{% endblock %}
