{% extends 'shop/base.html' %}{% block content %}<a class="back" href="{% url 'shop:supplier_list' %}">← К поставщикам</a><div class="detail"><h1>{{ supplier.name }}</h1><p><strong>Контактное лицо:</strong> {{ supplier.contact_person }}</p><p><strong>Телефон:</strong> {{ supplier.phone }}</p><p><strong>E-mail:</strong> {{ supplier.email }}</p><p><strong>Адрес:</strong> {{ supplier.address }}</p>{% if user.is_staff %}<div class="actions"><a class="btn" href="{% url 'shop:supplier_edit' supplier.pk %}">Изменить</a><a class="btn danger" href="{% url 'shop:supplier_delete' supplier.pk %}">Удалить</a></div>{% endif %}</div>{% endblock %}
